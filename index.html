<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Environmental Monitoring</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <!-- Our CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="header-inner">
            <div class="brand">
                <h1>Pakistan Environmental Watch</h1>
                <p>Real-time temperature and air quality across 10 cities</p>
            </div>
            <div class="header-right">
                <span id="lastUpdated">Last update: --</span>
                <button id="refreshBtn" type="button">⟳ Refresh now</button>
            </div>
        </div>
    </header>

    <div id="status" class="loading">
        Connecting to environmental data service...
    </div>

    <section id="stats" class="stats"></section>

    <div class="toolbar">
        <span class="toolbar-label">Color markers by</span>
        <div class="segmented">
            <button class="mode-btn active" data-mode="temperature" type="button">🌡️ Temperature</button>
            <button class="mode-btn" data-mode="aqi" type="button">😷 Air Quality (AQI)</button>
        </div>
    </div>

    <main class="layout">
        <aside id="cityList" class="city-list"></aside>
        <div id="map"></div>
    </main>

    <footer>
        <p>Web GIS Applications | BS Remote Sensing and GIS</p>
        <p class="small">Data: Open-Meteo Weather API &amp; Open-Meteo Air Quality API</p>
    </footer>

    <!-- Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Our JavaScript -->
    <script src="script.js"></script>

</body>

</html>
